# CA "auto-signée" : sert à fabriquer la CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Certificat de la CA du labo
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca
  namespace: cert-manager
spec:
  isCA: true                 # ce certificat a le droit d'en signer d'autres
  commonName: Lab CA
  secretName: lab-ca         # clé + certificat rangés dans ce Secret
  duration: 87600h           # 10 ans : La racine doit durer
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
# Emetteur que tout le labo utilisera : il signe avec la CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
